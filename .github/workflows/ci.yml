name: Backend and frontend checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENV: test
      DATABASE_URL: sqlite:///./test.db
      AUTO_SEED_GEO: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements_fastapi.txt
      - run: python -m pip install -r requirements_test.txt
      - name: Run feature tests
        run: python -m pytest -q --ignore=tests/test_api_route_smoke.py --ignore=tests/test_cors.py
      - name: Verify credentialed CORS preflight
        run: python -m pytest -q tests/test_cors.py
      - name: Sweep documented API routes
        run: |
          set +e
          python -m pytest -q tests/test_api_route_smoke.py > route-sweep.log 2>&1
          status=$?
          cat route-sweep.log >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

